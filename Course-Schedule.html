<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Schedule</title>
<style>
@font-face {
  font-family: 'Atkinson Hyperlegible';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/AtkinsonHyperlegible-Regular.woff2') format('woff2');
}
@font-face {
  font-family: 'Atkinson Hyperlegible';
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url('fonts/AtkinsonHyperlegible-Bold.woff2') format('woff2');
}
@font-face {
  font-family: 'Atkinson Hyperlegible';
  font-style: italic;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/AtkinsonHyperlegible-Italic.woff2') format('woff2');
}
@font-face {
  font-family: 'Atkinson Hyperlegible';
  font-style: italic;
  font-weight: 700;
  font-display: swap;
  src: url('fonts/AtkinsonHyperlegible-BoldItalic.woff2') format('woff2');
}
body {
  font-family: 'Atkinson Hyperlegible', -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 18px;
  line-height: 1.6;
  color: #1a1a1a;
  background: #ffffff;
  max-width: 800px;
  margin: 2rem auto;
  padding: 0 1.5rem 3rem;
}
/* Moodle's WYSIWYG editor bakes in a different inline font-family per page
   (Arial, Calibri, Times New Roman, etc.) - force everything back to the
   accessible stack above regardless of what the original page specified. */
body * {
  font-family: inherit !important;
}
h1, h2, h3, h4, h5, h6 {
  line-height: 1.3;
}
/* Explicit scale so no heading level ties or drops below the 18px body
   text - the browser default em-based scale shrinks below that starting
   at h4/h5 once the body font-size is bumped up this far for accessibility. */
h1 { font-size: 2em; }
h2 { font-size: 1.5em; }
h3 { font-size: 1.25em; }
h4 { font-size: 1.1em; }
h5 { font-size: 1em; }
img, video, iframe {
  max-width: 100%;
  height: auto;
}
a {
  color: #0b5fff;
}
table {
  border-collapse: collapse;
}
td, th {
  padding: 0.4em 0.8em;
}
/* Moodle CTF "flag" prompts are wrapped in a div with an inline neon-green
   border (#00ff11); the title inside is an h5 that barely stands out once
   pulled out of Moodle's own page chrome. Give it real visual weight, but
   with a darkened green (8.2:1 contrast on white, WCAG AAA) instead of the
   neon border color, which would be close to unreadable as text. */
div[style*="00ff11"] h5 {
  font-size: 1.3em;
  font-weight: 800;
  color: #0e5c1a;
  margin: 0 0 0.5em 0;
}
</style>
</head>
<body>
<h1>Course Schedule</h1>
<h2><span style="font-size: 1rem; font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, &quot;Noto Sans&quot;, &quot;Liberation Sans&quot;, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, &quot;Noto Color Emoji&quot;;">This course is eleven weeks long.&nbsp; The schedule below is tentative and subject to change.</span><br></h2>
<p></p>

<center><iframe src="https://classes.lanecc.edu/webservice/pluginfile.php/6584133/mod_page/content/8/CS_161P_Schedule_Winter_2024.pdf?token=e6f394e89e0848664344dbce4362ce95" style="width: 100%; height: 1000px;" quality="high" type="application/pdf"></iframe></center>
</body>
</html>
